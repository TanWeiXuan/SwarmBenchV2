name: Submission Reporter

on:
  workflow_run:
    workflows: ["Submission Validation"]
    types: [requested, in_progress, completed]

permissions:
  contents: read
  actions: read
  pull-requests: read

jobs:
  report:
    if: ${{ github.event.workflow_run.event == 'pull_request' }}
    runs-on: ubuntu-latest
    steps:
      - name: Resolve validated submission PR
        id: submission
        uses: actions/github-script@v7
        with:
          script: |
            const run = context.payload.workflow_run;
            let prNumber = run.pull_requests?.[0]?.number;
            if (!prNumber) {
              const headOwner = run.head_repository?.owner?.login;
              const {data: pulls} = headOwner && run.head_branch
                ? await github.rest.pulls.list({
                    ...context.repo,
                    state: 'open',
                    base: context.payload.repository.default_branch,
                    head: `${headOwner}:${run.head_branch}`,
                    per_page: 100
                  })
                : {data: []};
              const pull = pulls.find(candidate =>
                candidate.head.sha === run.head_sha
                && candidate.head.repo?.full_name === run.head_repository.full_name
              );
              prNumber = pull?.number;
            }
            if (!prNumber) return;
            const {data: files} = await github.rest.pulls.listFiles({...context.repo, pull_number: prNumber, per_page: 100});
            if (files.some(file => file.filename.startsWith('submissions/'))) {
              core.setOutput('pr_number', prNumber);
            }
      - name: Read validation jobs
        id: validation-jobs
        if: ${{ steps.submission.outputs.pr_number }}
        uses: actions/github-script@v7
        with:
          script: |
            const run = context.payload.workflow_run;
            const {data} = await github.rest.actions.listJobsForWorkflowRun({
              owner: context.repo.owner, repo: context.repo.repo, run_id: run.id, per_page: 100
            });
            core.setOutput('jobs', JSON.stringify(
              data.jobs.map(job => ({name: job.name, conclusion: job.conclusion}))
            ));
      - name: Create short-lived submission token
        id: app-token
        if: ${{ steps.submission.outputs.pr_number }}
        uses: actions/create-github-app-token@v3
        with:
          app-id: ${{ vars.SWARMBENCH_APP_ID }}
          private-key: ${{ secrets.SWARMBENCH_APP_PRIVATE_KEY }}
          permission-contents: write
          permission-pull-requests: write
      - name: Download final validated result
        if: ${{ steps.submission.outputs.pr_number && github.event.workflow_run.status == 'completed' && github.event.workflow_run.conclusion == 'success' }}
        uses: actions/download-artifact@v4
        with:
          name: calibration-result
          path: reporter-artifact
          run-id: ${{ github.event.workflow_run.id }}
          github-token: ${{ github.token }}
      - name: Update sticky progress and enable auto-merge
        if: ${{ steps.submission.outputs.pr_number }}
        uses: actions/github-script@v7
        env:
          PR_NUMBER: ${{ steps.submission.outputs.pr_number }}
          VALIDATION_JOBS: ${{ steps.validation-jobs.outputs.jobs }}
        with:
          github-token: ${{ steps.app-token.outputs.token }}
          script: |
            const run = context.payload.workflow_run;
            const prNumber = Number(process.env.PR_NUMBER);
            const jobs = JSON.parse(process.env.VALIDATION_JOBS);
            const mark = (prefix) => {
              const matches = jobs.filter(job => job.name.startsWith(prefix));
              if (!matches.length) return '⏳';
              if (matches.every(job => job.conclusion === 'success')) return '✅';
              if (matches.some(job => job.conclusion && job.conclusion !== 'success')) return '❌';
              return '🔄';
            };
            let body = '<!-- swarmbench-submission-progress -->\n🐝 **SwarmBench Submission Validation**\n\n';
            body += `${mark('Submission structure')} Submission structure\n`;
            body += `${mark('Controller import and API')} Controller import/API\n`;
            body += `${mark('Empty-arena smoke and timing')} Empty-arena smoke test\n`;
            const calibration = jobs.filter(job => job.name.startsWith('Calibration seed'));
            const done = calibration.filter(job => job.conclusion === 'success').length;
            body += `${mark('Calibration seed')} Calibration tournament — ${done} / 4 seed batches\n`;
            body += `${mark('Submission Gate')} Initial Glicko-2 and Submission Gate\n`;
            if (run.status === 'completed' && run.conclusion === 'success') {
              const fs = require('fs');
              const path = 'reporter-artifact/calibration-result.json';
              if (fs.existsSync(path)) {
                const result = JSON.parse(fs.readFileSync(path, 'utf8'));
                const valid = result.schema === 'swarmbench-calibration-v2'
                  && Number.isInteger(result.match_count)
                  && result.match_count === result.wins + result.draws + result.losses
                  && Number.isFinite(result.provisional_rating)
                  && Number.isFinite(result.deviation)
                  && result.timing && Number.isFinite(result.timing.mean);
                if (valid) {
                  body += `\n**Validation complete**\n\n`;
                  body += `Calibration: ${result.wins} W / ${result.draws} D / ${result.losses} L (${result.match_count} games)\n`;
                  body += `Initial Glicko-2: ${result.provisional_rating.toFixed(0)} (RD ${result.deviation.toFixed(0)})\n`;
                  body += `Mean / P95 / max step: ${(result.timing.mean*1000).toFixed(2)} / ${(result.timing.p95*1000).toFixed(2)} / ${(result.timing.max*1000).toFixed(2)} ms\n`;
                }
              }
            }
            let mergeNote = '⏳ Auto-merge';
            if (run.status === 'completed' && run.conclusion === 'success') {
              try {
                const {data: pull} = await github.rest.pulls.get({...context.repo, pull_number: prNumber});
                if (pull.draft) {
                  await github.graphql(`mutation($id: ID!) { markPullRequestReadyForReview(input: {pullRequestId: $id}) { clientMutationId } }`, {id: pull.node_id});
                }
                try {
                  await github.graphql(`mutation($id: ID!) { enablePullRequestAutoMerge(input: {pullRequestId: $id, mergeMethod: SQUASH}) { clientMutationId } }`, {id: pull.node_id});
                  mergeNote = pull.draft ? '✅ Marked ready and enabled auto-merge' : '✅ Auto-merge enabled';
                } catch (error) {
                  if (!error.message.includes('clean status')) throw error;
                  const {data: merge} = await github.rest.pulls.merge({
                    ...context.repo, pull_number: prNumber, sha: pull.head.sha, merge_method: 'squash'
                  });
                  if (!merge.merged) throw new Error(merge.message || 'merge was rejected');
                  mergeNote = pull.draft ? '✅ Marked ready and merged' : '✅ Merged';
                }
              } catch (error) {
                mergeNote = `⚠️ Validation passed; auto-merge could not be enabled (${error.message})`;
              }
            } else if (run.status === 'completed') {
              mergeNote = '❌ Auto-merge blocked by validation';
            }
            body += `${mergeNote}\n\n[Validation run](${run.html_url})`;
            const {data: comments} = await github.rest.issues.listComments({...context.repo, issue_number: prNumber, per_page: 100});
            const existing = comments.find(comment => comment.body?.includes('<!-- swarmbench-submission-progress -->'));
            if (existing) {
              await github.rest.issues.updateComment({...context.repo, comment_id: existing.id, body});
            } else {
              await github.rest.issues.createComment({...context.repo, issue_number: prNumber, body});
            }
