[build-system]
requires = ["hatchling>=1.25"]
build-backend = "hatchling.build"

[project]
name = "swarmbench"
version = "0.2.0"
description = "Deterministic multi-agent swarm control and combat benchmark"
readme = "README.md"
requires-python = ">=3.12"
license = { text = "MIT" }
dependencies = ["numpy>=2.0,<3"]

[project.optional-dependencies]
dev = ["pytest>=8.0", "pytest-cov>=5.0"]
competition = ["scipy>=1.14", "networkx>=3.3"]
render = ["pillow>=10.4"]

[project.scripts]
swarmbench = "swarmbench.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["src/swarmbench"]

[tool.pytest.ini_options]
addopts = "-ra"
testpaths = ["tests"]
